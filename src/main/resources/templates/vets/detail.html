<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vet Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Veterinarian Details</h2>

    <p><strong>Name:</strong> <span th:text="${vet.firstName + ' ' + vet.lastName}"></span></p>
    <p><strong>License:</strong> <span th:text="${vet.licenseNumber}"></span></p>
    <p><strong>Email:</strong> <span th:text="${vet.email}"></span></p>
    <p><strong>Phone:</strong> <span th:text="${vet.phoneNumber}"></span></p>
    <p><strong>Experience:</strong> <span th:text="${vet.yearsOfExperience}"></span> years</p>

    <a href="/vets" class="btn btn-secondary">Back</a>
</div>
</body>
</html>
