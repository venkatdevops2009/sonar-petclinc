<!-- HEALTH RECORDS FORM -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Health Record Form - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .form-control { border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4" th:text="${record.id} ? 'Edit Health Record' : 'Add Health Record'"></h2>
        
        <div class="card">
            <div class="card-body">
                <form th:action="${record.id} ? @{/health-records/{id}(id=${record.id})} : @{/health-records}" method="post" th:object="${record}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Pet *</label>
                            <select class="form-select" th:field="*{pet}" required>
                                <option value="">Select Pet</option>
                                <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.name} + ' (' + ${pet.owner.fullName} + ')'"></option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('pet')}" th:errors="*{pet}"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Record Type *</label>
                            <input type="text" class="form-control" th:field="*{recordType}" placeholder="e.g., Vaccination, Treatment" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('recordType')}" th:errors="*{recordType}"></span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Record Date *</label>
                            <input type="date" class="form-control" th:field="*{recordDate}" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('recordDate')}" th:errors="*{recordDate}"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Veterinarian *</label>
                            <select class="form-select" th:field="*{veterinarian}" required>
                                <option value="">Select Veterinarian</option>
                                <option th:each="vet : ${veterinarians}" th:value="${vet.id}" th:text="${vet.fullName}"></option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('veterinarian')}" th:errors="*{veterinarian}"></span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description *</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" required></textarea>
                        <span class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Diagnosis</label>
                            <input type="text" class="form-control" th:field="*{diagnosis}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Treatment</label>
                            <input type="text" class="form-control" th:field="*{treatment}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Medication</label>
                            <input type="text" class="form-control" th:field="*{medication}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Dosage</label>
                            <input type="text" class="form-control" th:field="*{dosage}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Additional Notes</label>
                        <textarea class="form-control" th:field="*{notes}" rows="2"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Save</button>
                        <a href="/health-records" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
