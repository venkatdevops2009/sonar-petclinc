<!-- PETS LIST, FORM, DETAIL -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pets - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border-radius: 8px; }
        .btn { border-radius: 6px; }
        .table { background-color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/owners">Owners</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/pets">Pets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/health-records">Health Records</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vets">Veterinarians</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-heart"></i> Pets Registry</h2>
            <a href="/pets/new" class="btn btn-success"><i class="bi bi-plus-circle"></i> Add Pet</a>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Pet Name</th>
                            <th>Type</th>
                            <th>Owner</th>
                            <th>Breed</th>
                            <th>DOB</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pet : ${pets}">
                            <td><strong th:text="${pet.name}"></strong></td>
                            <td><span class="badge bg-info" th:text="${pet.petType.name}"></span></td>
                            <td th:text="${pet.owner.fullName}"></td>
                            <td th:text="${pet.breed}"></td>
                            <td th:text="${#temporals.format(pet.dateOfBirth, 'yyyy-MM-dd')}"></td>
                            <td>
                                <a th:href="@{/pets/{id}(id=${pet.id})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i> View</a>
                                <a th:href="@{/pets/{id}/edit(id=${pet.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/pets/{id}/delete(id=${pet.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
