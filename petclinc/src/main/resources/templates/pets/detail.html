<!-- PETS DETAIL -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pet Details - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between mb-4">
            <h2 th:text="${pet.name}"></h2>
            <div>
                <a th:href="@{/pets/{id}/edit(id=${pet.id})}" class="btn btn-warning"><i class="bi bi-pencil"></i> Edit</a>
                <form th:action="@{/pets/{id}/delete(id=${pet.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete?')"><i class="bi bi-trash"></i> Delete</button>
                </form>
                <a href="/pets" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Pet Information</h5>
                        <p><strong>Name:</strong> <span th:text="${pet.name}"></span></p>
                        <p><strong>Type:</strong> <span class="badge bg-info" th:text="${pet.petType.name}"></span></p>
                        <p><strong>Breed:</strong> <span th:text="${pet.breed}"></span></p>
                        <p><strong>Color:</strong> <span th:text="${pet.color}"></span></p>
                        <p><strong>Date of Birth:</strong> <span th:text="${#temporals.format(pet.dateOfBirth, 'yyyy-MM-dd')}"></span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Owner</h5>
                        <p><a th:href="@{/owners/{id}(id=${pet.owner.id})}" th:text="${pet.owner.fullName}"></a></p>
                        <p><strong>Address:</strong> <span th:text="${pet.owner.address}"></span></p>
                        <p><strong>Phone:</strong> <span th:text="${pet.owner.telephone}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-body">
                <h5 class="card-title">Health Records</h5>
                <a th:href="@{/health-records/pet/{id}(id=${pet.id})}" class="btn btn-info btn-sm"><i class="bi bi-file-medical"></i> View All Records</a>
                <a th:href="@{/health-records/new(petId=${pet.id})}" class="btn btn-success btn-sm"><i class="bi bi-plus"></i> Add Record</a>
            </div>
        </div>
    </div>
</body>
</html>
