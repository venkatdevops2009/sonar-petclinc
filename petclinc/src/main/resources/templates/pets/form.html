<!-- PETS FORM -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pet Form - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4" th:text="${pet.id} ? 'Edit Pet' : 'Add New Pet'"></h2>
        
        <div class="card">
            <div class="card-body">
                <form th:action="${pet.id} ? @{/pets/{id}(id=${pet.id})} : @{/pets}" method="post" th:object="${pet}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Pet Name *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Pet Type *</label>
                            <select class="form-select" th:field="*{petType}" required>
                                <option value="">Select Pet Type</option>
                                <option th:each="type : ${petTypes}" th:value="${type.id}" th:text="${type.name}"></option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('petType')}" th:errors="*{petType}"></span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Owner *</label>
                            <select class="form-select" th:field="*{owner}" required>
                                <option value="">Select Owner</option>
                                <option th:each="owner : ${owners}" th:value="${owner.id}" th:text="${owner.fullName}"></option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('owner')}" th:errors="*{owner}"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date of Birth *</label>
                            <input type="date" class="form-control" th:field="*{dateOfBirth}" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Breed</label>
                            <input type="text" class="form-control" th:field="*{breed}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Color</label>
                            <input type="text" class="form-control" th:field="*{color}">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Save</button>
                        <a href="/pets" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
