<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vet Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${vet.id != null} ? 'Edit Vet' : 'Add Vet'"></h2>

<form th:action="${vet != null and vet.id != null} ? @{/vets/{id}(id=${vet.id})} : @{/vets}" method="post" th:object="${vet}">

    <div class="mb-3">
        <label>First Name</label>
        <input type="text" th:field="*{firstName}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Last Name</label>
        <input type="text" th:field="*{lastName}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>License Number</label>
        <input type="text" th:field="*{licenseNumber}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" th:field="*{email}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Phone Number</label>
        <input type="text" th:field="*{phoneNumber}" class="form-control"/>
    </div>

    <div class="mb-3">
    <label>Experience (Years)</label>
    <input type="number" class="form-control" th:field="*{yearsOfExperience}" min="0">
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/vets" class="btn btn-secondary">Back</a>
</form>

</body>
</html>
