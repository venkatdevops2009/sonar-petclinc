<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veterinarians - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .vet-card { border-radius: 8px; border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/owners">Owners</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pets">Pets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/health-records">Health Records</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/vets">Veterinarians</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-stethoscope"></i> Our Veterinarians</h2>
            <a href="/vets/new" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add Veterinarian</a>
        </div>

        <div class="row">
            <div th:each="vet : ${vets}" class="col-md-4 mb-3">
                <div class="card vet-card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${vet.fullName}"></h5>
                        <p class="text-muted" th:text="${vet.licenseNumber}"></p>
                        <hr>
                        <p><strong><i class="bi bi-envelope"></i> Email:</strong> <a th:href="'mailto:' + ${vet.email}" th:text="${vet.email}"></a></p>
                        <p><strong><i class="bi bi-telephone"></i> Phone:</strong> <span th:text="${vet.phoneNumber}"></span></p>
                        <p><strong><i class="bi bi-briefcase"></i> Experience:</strong> <span th:text="${vet.yearsOfExperience} + ' years'"></span></p>
                        <p><strong>Specialties:</strong></p>
                        <div th:if="${vet.specialties.size() > 0}">
                            <span class="badge bg-info" th:each="spec : ${vet.specialties}" th:text="${spec.name}"></span>
                        </div>
                        <p th:if="${vet.specialties.size() == 0}" class="text-muted">No specialties listed</p>
                        <div class="mt-3">
                            <a th:href="@{/vets/{id}(id=${vet.id})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i> View</a>
                            <a th:href="@{/vets/{id}/edit(id=${vet.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i> Edit</a>
                            <form th:action="@{/vets/{id}/delete(id=${vet.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
