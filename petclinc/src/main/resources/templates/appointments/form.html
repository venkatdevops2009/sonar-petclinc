<!-- APPOINTMENTS FORM -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment Form - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4" th:text="${appointment.id} ? 'Edit Appointment' : 'Book Appointment'"></h2>
        
        <div class="card">
            <div class="card-body">
                <form th:action="${appointment.id} ? @{/appointments/{id}(id=${appointment.id})} : @{/appointments}" method="post" th:object="${appointment}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Pet *</label>
                            <select class="form-select" th:field="*{pet}" required>
                                <option value="">Select Pet</option>
                                <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.name} + ' - ' + ${pet.owner.fullName}"></option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('pet')}" th:errors="*{pet}"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Veterinarian *</label>
                            <select class="form-select" th:field="*{veterinarian}" required>
                                <option value="">Select Veterinarian</option>
                                <option th:each="vet : ${veterinarians}" th:value="${vet.id}" th:text="${vet.fullName}"></option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('veterinarian')}" th:errors="*{veterinarian}"></span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Appointment Date & Time *</label>
                        <input type="datetime-local" class="form-control" th:field="*{appointmentTime}" required>
                        <span class="text-danger" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></span>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Reason for Visit</label>
                            <input type="text" class="form-control" th:field="*{reason}" placeholder="e.g., Regular Checkup">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" th:field="*{notes}" rows="3"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Save</button>
                        <a href="/appointments" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
