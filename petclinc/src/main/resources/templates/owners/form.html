<!-- OWNERS FORM -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${owner.id} ? 'Edit Owner' : 'Add Owner' + ' - Pet Clinic'">Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .form-control, .form-select { border-radius: 6px; }
        .btn { border-radius: 6px; font-weight: 500; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4" th:text="${owner.id} ? 'Edit Owner' : 'Add New Owner'"></h2>
        
        <div class="card">
            <div class="card-body">
                <form th:action="${owner.id} ? @{/owners/{id}(id=${owner.id})} : @{/owners}" method="post" th:object="${owner}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name *</label>
                            <input type="text" class="form-control" th:field="*{firstName}" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name *</label>
                            <input type="text" class="form-control" th:field="*{lastName}" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address *</label>
                        <input type="text" class="form-control" th:field="*{address}" required>
                        <span class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City *</label>
                            <input type="text" class="form-control" th:field="*{city}" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telephone *</label>
                            <input type="tel" class="form-control" th:field="*{telephone}" required>
                            <span class="text-danger" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Save</button>
                        <a href="/owners" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
