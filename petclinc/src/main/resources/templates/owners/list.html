<!-- OWNERS LIST -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Owners - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI'; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .table { background-color: #fff; }
        .btn { border-radius: 6px; font-weight: 500; }
        .table-hover tbody tr:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/owners">Owners</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pets">Pets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/health-records">Health Records</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vets">Veterinarians</a></li>
                    <li class="nav-item"><a class="nav-link" href="/appointments">Appointments</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people"></i> Pet Owners</h2>
            <a href="/owners/new" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add Owner</a>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th><i class="bi bi-person"></i> Name</th>
                            <th><i class="bi bi-geo-alt"></i> Address</th>
                            <th><i class="bi bi-building"></i> City</th>
                            <th><i class="bi bi-telephone"></i> Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="owner : ${owners}">
                            <td><strong th:text="${owner.fullName}"></strong></td>
                            <td th:text="${owner.address}"></td>
                            <td th:text="${owner.city}"></td>
                            <td th:text="${owner.telephone}"></td>
                            <td>
                                <a th:href="@{/owners/{id}(id=${owner.id})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i> View</a>
                                <a th:href="@{/owners/{id}/edit(id=${owner.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i> Edit</a>
                                <form th:action="@{/owners/{id}/delete(id=${owner.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')"><i class="bi bi-trash"></i> Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
