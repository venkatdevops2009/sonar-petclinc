<!-- OWNERS DETAIL -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Owner Details - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border-radius: 8px; }
        .btn { border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital"></i> Pet Clinic</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between mb-4">
            <h2 th:text="${owner.fullName}"></h2>
            <div>
                <a th:href="@{/owners/{id}/edit(id=${owner.id})}" class="btn btn-warning"><i class="bi bi-pencil"></i> Edit</a>
                <form th:action="@{/owners/{id}/delete(id=${owner.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?')"><i class="bi bi-trash"></i> Delete</button>
                </form>
                <a href="/owners" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Owner Information</h5>
                        <p><strong>Name:</strong> <span th:text="${owner.fullName}"></span></p>
                        <p><strong>Address:</strong> <span th:text="${owner.address}"></span></p>
                        <p><strong>City:</strong> <span th:text="${owner.city}"></span></p>
                        <p><strong>Telephone:</strong> <span th:text="${owner.telephone}"></span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Pets</h5>
                        <div th:if="${owner.pets.size() > 0}">
                            <ul class="list-group">
                                <li class="list-group-item" th:each="pet : ${owner.pets}">
                                    <a th:href="@{/pets/{id}(id=${pet.id})}" th:text="${pet.name}"></a>
                                    <span class="badge bg-info" th:text="${pet.petType.name}"></span>
                                </li>
                            </ul>
                        </div>
                        <p th:if="${owner.pets.size() == 0}" class="text-muted">No pets registered</p>
                        <a href="/pets/new" class="btn btn-sm btn-primary mt-2"><i class="bi bi-plus"></i> Add Pet</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
