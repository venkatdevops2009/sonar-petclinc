spring:
  application:
    name: petclinic
  datasource:
    url: jdbc:mysql://petclinic-db.c6ls6uk4g8uk.us-east-1.rds.amazonaws.com:3306/petclinic?useSSL=true&allowPublicKeyRetrieval=true
    username: admin
    password: Piridi0505
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  thymeleaf:
    cache: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.petclinic: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  file:
    name: /opt/petclinic/logs/petclinic.log
    max-size: 10MB
    max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

